name: Monthly_cycle
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 5"

jobs:
  gate:
    # Cron fires every Friday; only proceed on manual runs or the first Friday (day 1-7)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%-d)" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CI: "true"
    defaults:
      run:
        working-directory: QA-Retention
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: QA-Retention/requirements.txt

      - name: Install deps (skip macOS-only packages)
        run: |
          grep -v -i '^pyobjc\|^pyperclipimg' requirements.txt > req-ci.txt
          pip install -r req-ci.txt
          sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1 pulseaudio libasound2-plugins
          playwright install --with-deps chrome

      - name: Start virtual audio device
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_sink
          pactl set-default-sink ci_sink
          printf 'pcm.!default pulse\nctl.!default pulse\n' > ~/.asoundrc
          python -c "import sounddevice as sd; print(sd.query_devices())"

      - name: Write credentials
        env:
          USER_CRED_JSON: ${{ secrets.USER_CRED_JSON }}
        run: |
          printf '%s' "$USER_CRED_JSON" > data/userCred.json
          echo "secret length: $(wc -c < data/userCred.json) bytes"
          echo "first 6 bytes: $(head -c 6 data/userCred.json | od -An -c)"
          python -m json.tool data/userCred.json > /dev/null \
            || { echo "::error::USER_CRED_JSON secret is not valid JSON (empty, truncated, or duplicated braces)"; exit 1; }

      - name: Run tests
        run: pytest tests -s

      - name: Verify call links CSV and report exist
        if: always()
        run: |
          test -s call_summary.csv || { echo "::error::call_summary.csv missing or empty"; exit 1; }
          test -s report/report.html || { echo "::error::report/report.html missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            QA-Retention/report/
            QA-Retention/results/
            QA-Retention/call_summary.csv
            QA-Retention/call_summary.xlsx
