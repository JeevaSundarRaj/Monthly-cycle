name: Tests
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
    defaults:
      run:
        working-directory: QA-Retention
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: QA-Retention/requirements.txt

      - name: Install deps (skip macOS-only packages)
        run: |
          grep -v -i '^pyobjc\|^pyperclipimg' requirements.txt > req-ci.txt
          pip install -r req-ci.txt
          sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1
          playwright install --with-deps chrome

      - name: Write credentials
        env:
          USER_CRED_JSON: ${{ secrets.USER_CRED_JSON }}
        run: printf '%s' "$USER_CRED_JSON" > data/userCred.json

      - name: Run tests
        run: pytest tests -m "not calls" -s

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            QA-Retention/report/
            QA-Retention/results/
            QA-Retention/call_summary.csv
