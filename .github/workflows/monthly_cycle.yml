name: Monthly_cycle
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 3"  # Wednesday: full cycle (first Wednesday of month)
    - cron: "0 3 * * 5"  # Friday: inbox check only (2 days after first Wednesday)

jobs:
  gate:
    # Cron fires every Wed and Fri. Proceed on manual runs, the first Wednesday
    # (day 1-7, full cycle), or the Friday 2 days after it (day 3-9, inbox only).
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - id: check
        run: |
          day=$(date -u +%-d); dow=$(date -u +%u); run=false; mode=full
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run=true
          elif [ "$dow" = "3" ] && [ "$day" -le 7 ]; then
            run=true
          elif [ "$dow" = "5" ] && [ "$day" -ge 3 ] && [ "$day" -le 9 ]; then
            run=true; mode=inbox
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CI: "true"
    defaults:
      run:
        working-directory: QA-Retention
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: QA-Retention/requirements.txt

      - name: Install deps (skip macOS-only packages)
        run: |
          grep -v -i '^pyobjc\|^pyperclipimg' requirements.txt > req-ci.txt
          pip install -r req-ci.txt
          sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1 pulseaudio libasound2-plugins
          playwright install --with-deps chrome

      - name: Start virtual audio device
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_sink
          pactl set-default-sink ci_sink
          printf 'pcm.!default pulse\nctl.!default pulse\n' > ~/.asoundrc
          python -c "import sounddevice as sd; print(sd.query_devices())"

      - name: Write credentials
        env:
          USER_CRED_JSON: ${{ secrets.USER_CRED_JSON }}
        run: |
          printf '%s' "$USER_CRED_JSON" > data/userCred.json
          echo "secret length: $(wc -c < data/userCred.json) bytes"
          echo "first 6 bytes: $(head -c 6 data/userCred.json | od -An -c)"
          python -m json.tool data/userCred.json > /dev/null \
            || { echo "::error::USER_CRED_JSON secret is not valid JSON (empty, truncated, or duplicated braces)"; exit 1; }

      - name: Run tests
        run: |
          set -o pipefail
          if [ "${{ needs.gate.outputs.mode }}" = "inbox" ]; then
            target=tests/retention/test_inbox.py
          else
            target=tests
          fi
          pytest "$target" -s 2>&1 | tee pytest_output.log

      - name: Verify call links CSV and report exist
        if: always() && needs.gate.outputs.mode != 'inbox'
        run: |
          test -s call_summary.csv || { echo "::error::call_summary.csv missing or empty"; exit 1; }
          test -s report/report.html || { echo "::error::report/report.html missing"; exit 1; }

      - name: Publish job summary
        if: always()
        run: python utils/ci_summary.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          if-no-files-found: warn
          path: |
            QA-Retention/report/
            QA-Retention/results/
            QA-Retention/call_summary.csv
            QA-Retention/call_summary.xlsx
            QA-Retention/call_logs_*.xlsx
            QA-Retention/call.logs
            QA-Retention/output.json
            QA-Retention/pytest_output.log
            QA-Retention/dbg_*.png
